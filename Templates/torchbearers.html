        <h1 class="sec-header">TORCHBEARERS</h1>
        <p class="tb-subtitle">Presidents of UDAAN, past &amp; present</p>
      </header>

      <section class="tb-current-section" aria-labelledby="tb-current-heading">
        <h2 id="tb-current-heading" class="tb-section-title">Current President</h2>
        <div id="tb-current-mount"></div>
      </section>

      <section aria-labelledby="tb-past-heading">
        <h2 id="tb-past-heading" class="tb-section-title">Past Presidents</h2>
        <ol id="tb-timeline-mount" class="tb-timeline"></ol>
      </section>
    </div>
  </main>

  <div id="udaan-footer-root"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var list = Array.isArray(window.UDAAN_TORCHBEARERS) ? window.UDAAN_TORCHBEARERS : [];
      var current = list.find(function (p) { return p && p.isCurrent; }) || list[0];
      var past = list.filter(function (p) { return p && p !== current; });

      var currentMount = document.getElementById("tb-current-mount");
      if (currentMount && current) {
        var article = document.createElement("article");
        article.className = "tb-hero-card tb-reveal";

        var media = document.createElement("div");
        media.className = "tb-hero-media";
        var img = document.createElement("img");
        img.src = current.photo || "../Assets/presidents/placeholder.svg";
        img.alt = current.name || "Current President";
        img.width = 240;
        img.height = 240;
        media.appendChild(img);

        var body = document.createElement("div");
        var badge = document.createElement("span");
        badge.className = "tb-badge";
        badge.textContent = "President · " + (current.tenure || "2025–26");
        body.appendChild(badge);

        var nameEl = document.createElement("h3");
        nameEl.className = "tb-hero-name";
        nameEl.textContent = current.name || "";
        body.appendChild(nameEl);

        if (current.branch) {
          var meta = document.createElement("p");
          meta.className = "tb-hero-meta";
          meta.textContent = current.branch;
          body.appendChild(meta);
        }

        if (current.note) {
          var note = document.createElement("p");
          note.className = "tb-hero-note";
          note.textContent = current.note;
          body.appendChild(note);
        }

        article.appendChild(media);
        article.appendChild(body);
        currentMount.appendChild(article);
      }

      var timelineMount = document.getElementById("tb-timeline-mount");
      if (timelineMount) {
        past.forEach(function (person) {
          var li = document.createElement("li");
          li.className = "tb-item tb-reveal";

          var node = document.createElement("span");
          node.className = "tb-node";
          node.setAttribute("aria-hidden", "true");
          li.appendChild(node);

          var card = document.createElement("article");
          card.className = "tb-card";

          var top = document.createElement("div");
          top.className = "tb-card-top";

          var avatar = document.createElement("div");
          avatar.className = "tb-avatar";
          var pImg = document.createElement("img");
          pImg.src = person.photo || "../Assets/presidents/placeholder.svg";
          pImg.alt = person.name || "Past President";
          pImg.width = 72;
          pImg.height = 72;
          pImg.loading = "lazy";
          pImg.decoding = "async";
          avatar.appendChild(pImg);

          var info = document.createElement("div");
          var tenure = document.createElement("span");
          tenure.className = "tb-tenure";
          tenure.textContent = person.tenure || "";
          info.appendChild(tenure);

          var pName = document.createElement("h3");
          pName.className = "tb-name";
          pName.textContent = person.name || "";
          info.appendChild(pName);

          if (person.branch) {
            var pBranch = document.createElement("p");
            pBranch.className = "tb-branch";
            pBranch.textContent = person.branch;
            info.appendChild(pBranch);
          }

          top.appendChild(avatar);
          top.appendChild(info);
          card.appendChild(top);

          if (person.note) {
            var pNote = document.createElement("p");
            pNote.className = "tb-note";
            pNote.textContent = person.note;
            card.appendChild(pNote);
          }

          li.appendChild(card);
          timelineMount.appendChild(li);
        });
      }

      var reveals = document.querySelectorAll(".tb-reveal");
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) {
        reveals.forEach(function (el) { el.classList.add("is-visible"); });
      } else {
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              obs.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });
        reveals.forEach(function (el) { obs.observe(el); });
      }
    });
  </script>
